<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>201座位表 (支援圖片匯出)</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 20px; margin: 0; }
    h1 { font-size: 2.2rem; color: #38bdf8; margin-bottom: 5px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    
    .panel { background: #1e293b; border: 2px solid #334155; max-width: 980px; margin: 0 auto 20px; padding: 15px; border-radius: 12px; display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; gap: 8px; }
    
    .starter-picker { display: flex; align-items: center; gap: 6px; background: #0f172a; padding: 6px 12px; border-radius: 8px; border: 1px solid #475569; }
    select, input, textarea { font-size: 15px; padding: 6px 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white; }
    
    .current-badge { background: linear-gradient(135deg, #0284c7, #2563eb); padding: 8px 16px; border-radius: 8px; font-size: 16px; font-weight: bold; }
    .next-badge { background: linear-gradient(135deg, #d97706, #b45309); padding: 8px 16px; border-radius: 8px; font-size: 16px; font-weight: bold; }
    
    button { font-size: 14px; padding: 8px 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: all 0.2s; }
    button.draw-btn { font-size: 18px; padding: 10px 24px; border-radius: 30px; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
    button.draw-btn:hover { transform: scale(1.05); }
    button.draw-btn:disabled { background: #475569; box-shadow: none; cursor: not-allowed; }
    button.edit-btn { background: #eab308; color: #0f172a; }
    button.export-btn { background: #06b6d4; color: #0f172a; }
    button.image-btn { background: #ec4899; color: white; }
    button.name-btn { background: #a855f7; color: white; }
    button.reset-btn { background: #ef4444; color: white; }
    button.swap-btn { background: #f472b6; color: #0f172a; }
    .seat { min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .seat.selected { background: #be185d; border-color: #f9a8d4; color: #fff; transform: scale(1.06); box-shadow: 0 0 16px #f472b6; }

    /* 需被截圖轉換的班級座位區域 */
    #exportArea { background: #0f172a; padding: 15px; border-radius: 12px; max-width: 980px; margin: 0 auto; }

    .classroom-front { max-width: 980px; margin: 0 auto 15px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .blackboard { background: #14532d; border: 4px solid #166534; color: #f0fdf4; width: 70%; padding: 10px; border-radius: 8px; font-size: 20px; font-weight: bold; letter-spacing: 6px; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
    .podium { background: #78350f; border: 3px solid #b45309; color: #fef3c7; width: 28%; padding: 8px; border-radius: 6px; font-size: 16px; font-weight: bold; letter-spacing: 2px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); }

    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; max-width: 980px; margin: 0 auto; }
    .seat { background: #1e293b; border: 2px solid #334155; border-radius: 10px; padding: 14px 5px; font-size: 15px; font-weight: bold; transition: all 0.15s ease; }
    .seat.empty { border-color: #475569; color: #94a3b8; }
    .seat.active { background: #38bdf8; border-color: #7dd3fc; color: #0f172a; transform: scale(1.08); box-shadow: 0 0 20px #38bdf8; z-index: 10; }
    .seat.taken { background: #15803d; border-color: #4ade80; color: #f0fdf4; }
    .seat.editing { border-color: #eab308; background: #292524; }
    .seat input.seat-num-input { width: 70%; text-align: center; font-size: 15px; font-weight: bold; background: #0f172a; color: #38bdf8; border: 1px solid #eab308; border-radius: 4px; }

    .history-section { background: #1e293b; border: 2px solid #334155; max-width: 980px; margin: 20px auto 0; padding: 15px; border-radius: 12px; text-align: left; }
    .history-list { max-height: 180px; overflow-y: auto; background: #0f172a; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 14px; }
    .history-item { padding: 4px 0; border-bottom: 1px dashed #334155; color: #38bdf8; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
    .modal-content { background: #1e293b; border: 2px solid #38bdf8; padding: 20px; border-radius: 12px; max-width: 500px; width: 90%; text-align: left; }

    @media print {
      body { background: white; color: black; }
      .panel, button, .history-section, .modal { display: none; }
      .blackboard { background: white; color: black; border: 2px solid black; }
      .podium { background: #eee; color: black; border: 2px solid black; }
      .seat { border: 1px solid black; color: black !important; background: white !important; }
    }
  </style>
</head>
<body>

  <h1>🔗 201座位表 <span id="syncStatus" style="font-size:14px; color:#94a3b8;">(載入中…)</span></h1>
  
  <div class="panel">
    <button class="name-btn" onclick="openNameModal()">📋 學生名單</button>

    <div class="starter-picker">
      <label>🎯 首位：</label>
      <select id="starterSelect" onchange="setStarter(this.value)"></select>
    </div>

    <button class="edit-btn" id="editToggleBtn" onclick="toggleEditMode()">✏️ 編輯號碼</button>
    <button class="swap-btn" id="swapToggleBtn" onclick="toggleSwapMode()">🔀 手動換座位</button>
    <button class="draw-btn" id="drawBtn" onclick="startChainDraw()">🎲 抽座位</button>

    <div class="current-badge" id="currentBox">目前：1 號</div>
    <div class="next-badge" id="nextBox">下一位：? 號</div>

    <button class="image-btn" onclick="exportToImage()">🖼️ 匯出 PNG 圖片</button>
    <button class="export-btn" onclick="exportToCSV()">📥 匯出 CSV</button>
    <button class="export-btn" onclick="window.print()">🖨️ 列印座位表</button>
    <button class="reset-btn" onclick="resetAllData()">🔄 清空重抽</button>
  </div>

  <!-- 圖像導出抓取區域 -->
  <div id="exportArea">
    <div class="classroom-front">
      <div class="blackboard">【 黑 板 / 螢 幕區 】</div>
      <div class="podium">🏫 講 桌（教師位）</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="history-section">
    <h3 style="margin-top:0; color:#38bdf8;">📜 抽籤歷史連鎖紀錄</h3>
    <div class="history-list" id="historyList">
      <div style="color:#64748b;">尚未開始抽籤，紀錄將於抽籤後自動寫入...</div>
    </div>
  </div>

  <div class="modal" id="nameModal">
    <div class="modal-content">
      <h3 style="margin-top:0; color:#38bdf8;">📋 貼上 201 班學生名單</h3>
      <p style="font-size:13px; color:#94a3b8;">一行一個名字，自動依序對應 1 ~ 36 號：</p>
      <textarea id="nameInputText" rows="10" style="width:95%; font-size:14px; margin-bottom:10px;"></textarea>
      <div style="text-align:right;">
        <button onclick="closeNameModal()" style="background:#64748b; color:white; margin-right:5px;">取消</button>
        <button onclick="saveStudentNames()" style="background:#22c55e; color:white;">💾 儲存名單</button>
      </div>
    </div>
  </div>

  <script>
    const TOTAL_SEATS = 36;
    const STORAGE_KEY = '201_SEAT_PICKER_WITH_IMAGE_DATA';

    let studentNames = Array.from({length: TOTAL_SEATS}, (_, i) => `學生${i + 1}`);
    let seats = Array.from({length: TOTAL_SEATS}, (_, i) => ({ label: `${i + 1}`, assignedStudentId: null }));
    let drawnStudents = [];
    let historyLog = [];
    let currentStudentId = 1;
    let isEditingMode = false;
    let isGameStarted = false;
    let audioCtx = null;

    let isSpinning = false;
    let isSwapMode = false;
    let swapSelected = -1;
    const CLOUD_PATH = 'seating/state';
    let cloudDoc = null, cloudWriting = false, cloudDirty = false;

    function stateObject() {
      return { studentNames, seats, drawnStudents, historyLog, currentStudentId, isGameStarted };
    }

    function canon(o) {
      return JSON.stringify(o, (k, v) => (v && typeof v === 'object' && !Array.isArray(v))
        ? Object.fromEntries(Object.keys(v).sort().map(key => [key, v[key]])) : v);
    }

    function applyState(p) {
      // 深拷貝：雲端回傳的資料是唯讀的，直接使用會導致之後無法修改
      const c = JSON.parse(JSON.stringify(p));
      if (Array.isArray(c.studentNames)) studentNames = c.studentNames;
      if (Array.isArray(c.seats)) {
        seats = Array.from({ length: TOTAL_SEATS }, (_, i) => {
          const s = c.seats[i] || {};
          const hasLabel = s.label !== undefined && s.label !== null && String(s.label).trim() !== '';
          return { label: hasLabel ? String(s.label) : `${i + 1}`, assignedStudentId: s.assignedStudentId ?? null };
        });
      }
      drawnStudents = c.drawnStudents || [];
      historyLog = c.historyLog || [];
      currentStudentId = c.currentStudentId || 1;
      isGameStarted = !!c.isGameStarted;
    }

    function setSync(text, color) {
      const el = document.getElementById('syncStatus');
      if (el) { el.textContent = text; el.style.color = color; }
    }

    function saveData() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stateObject())); } catch (e) {}
      pushCloud();
    }

    function loadData() {
      let saved = null;
      try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
      if (saved) {
        try { applyState(JSON.parse(saved)); }
        catch (e) { console.error("載入舊資料失敗", e); }
      }
    }

    async function pushCloud() {
      if (!cloudDoc) return;
      if (cloudWriting) { cloudDirty = true; return; }
      cloudWriting = true;
      try {
        do {
          cloudDirty = false;
          await cloudDoc.set({ ...stateObject(), updatedAt: Date.now() });
        } while (cloudDirty);
        setSync('☁️ 已同步到雲端（換電腦也能用）', '#22c55e');
      } catch (e) {
        console.error(e);
        setSync(e && e.code === 'invalid_argument' ? '👀 唯讀（沒有寫入權限）' : '⚠️ 雲端儲存失敗，僅存本機', '#f59e0b');
      } finally {
        cloudWriting = false;
      }
    }

    function refreshUI() {
      initStarterSelect();
      render();
      renderHistory();
      const last = [...historyLog].reverse().find(h => !h.type);
      document.getElementById('nextBox').innerText = !last ? '下一位：? 號'
        : (last.nextStudentId ? `👉 下一位接棒：${getStudentDisplayName(last.nextStudentId)}` : '🎉 全班完成！');
      const free = seats.some(s => s.assignedStudentId === null);
      document.getElementById('drawBtn').disabled = !free || (last && !last.nextStudentId);
    }

    async function initCloud() {
      let db = null;
      try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) {}
      if (!db) { setSync('💾 僅存本機（此瀏覽器）', '#94a3b8'); return; }
      cloudDoc = db.doc(CLOUD_PATH);
      setSync('☁️ 連線雲端中…', '#94a3b8');
      cloudDoc.onSnapshot(snap => {
        if (snap.metadata.fromCache && !snap.exists) return;
        if (!snap.exists) {
          // 雲端還沒資料：把本機目前的資料上傳
          saveData();
          return;
        }
        setSync('☁️ 已同步到雲端（換電腦也能用）', '#22c55e');
        if (isSpinning || cloudWriting || cloudDirty || isEditingMode || isSwapMode) return;
        const remote = snap.data();
        const before = canon(stateObject());
        applyState(remote);
        if (canon(stateObject()) === before) return;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stateObject())); } catch (e) {}
        refreshUI();
      }, err => {
        console.error(err);
        cloudDoc = null;
        setSync('⚠️ 雲端中斷，僅存本機', '#f59e0b');
      });
    }

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(freq, duration = 0.08) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function getStudentDisplayName(id) {
      return `${id}號 ${studentNames[id - 1] || ''}`;
    }

    function initStarterSelect() {
      const select = document.getElementById('starterSelect');
      select.innerHTML = '';
      for (let i = 1; i <= TOTAL_SEATS; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = getStudentDisplayName(i);
        select.appendChild(opt);
      }
      select.value = currentStudentId;
      select.disabled = !!isGameStarted;
    }

    function openNameModal() {
      document.getElementById('nameInputText').value = studentNames.join('\n');
      document.getElementById('nameModal').style.display = 'flex';
    }

    function closeNameModal() {
      document.getElementById('nameModal').style.display = 'none';
    }

    function saveStudentNames() {
      const text = document.getElementById('nameInputText').value;
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      lines.forEach((name, idx) => {
        if (idx < TOTAL_SEATS) {
          studentNames[idx] = name;
        }
      });
      closeNameModal();
      saveData();
      initStarterSelect();
      render();
    }

    function setStarter(num) {
      if (isGameStarted) return;
      currentStudentId = parseInt(num);
      saveData();
      render();
    }

    function toggleEditMode() {
      if (isGameStarted) return;
      if (isSwapMode) toggleSwapMode();
      isEditingMode = !isEditingMode;
      const btn = document.getElementById('editToggleBtn');
      btn.innerText = isEditingMode ? '💾 完成修改' : '✏️ 編輯號碼';
      render();
    }

    function updateSeatLabel(idx, newLabel) {
      seats[idx].label = newLabel.trim() || `${idx + 1}`;
      saveData();
    }

    function toggleSwapMode() {
      if (isSpinning) return;
      if (isEditingMode) toggleEditMode();
      isSwapMode = !isSwapMode;
      swapSelected = -1;
      document.getElementById('swapToggleBtn').innerText = isSwapMode ? '✅ 完成換位' : '🔀 手動換座位';
      render();
    }

    function onSeatClick(idx) {
      if (isSpinning || !isSwapMode) return;
      if (swapSelected === -1) {
        if (seats[idx].assignedStudentId === null) return;
        swapSelected = idx;
        render();
        return;
      }
      if (swapSelected === idx) {
        swapSelected = -1;
        render();
        return;
      }
      const a = seats[swapSelected], b = seats[idx];
      const sid = a.assignedStudentId, tid = b.assignedStudentId;
      a.assignedStudentId = tid;
      b.assignedStudentId = sid;
      historyLog.push({ type: 'swap', studentId: sid, seatLabel: b.label, fromSeatLabel: a.label, otherStudentId: tid });
      swapSelected = -1;
      saveData();
      render();
      renderHistory();
    }

    function render(highlightIdx = -1) {
      const container = document.getElementById('grid');
      container.innerHTML = '';
      
      seats.forEach((seat, idx) => {
        const div = document.createElement('div');
        let stateClass = 'empty';

        if (idx === highlightIdx) stateClass = 'active';
        else if (seat.assignedStudentId !== null) stateClass = 'taken';
        else if (isEditingMode) stateClass = 'editing';

        div.className = `seat ${stateClass}` + (isSwapMode && idx === swapSelected ? ' selected' : '');
        if (isSwapMode) {
          div.style.cursor = 'pointer';
          div.onclick = () => onSeatClick(idx);
        }

        if (isEditingMode && seat.assignedStudentId === null) {
          div.innerHTML = `
            <span style="font-size:12px; opacity:0.7;">位置 ${idx + 1}：</span><br>
            <input type="text" class="seat-num-input" value="${seat.label}" onchange="updateSeatLabel(${idx}, this.value)" onclick="event.stopPropagation()">
          `;
        } else {
          let text = seat.assignedStudentId !== null ? '' : `<span style="font-size:13px; opacity:0.8;">【座位 ${seat.label}】</span><br>`;
          if (seat.assignedStudentId !== null) {
            text += `👤 ${getStudentDisplayName(seat.assignedStudentId)}`;
          } else {
            text += `<span style="font-size:13px; opacity:0.5;">(空位)</span>`;
          }
          div.innerHTML = text;
        }

        container.appendChild(div);
      });

      document.getElementById('currentBox').innerText = `目前：${getStudentDisplayName(currentStudentId)}`;
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      if (historyLog.length === 0) {
        list.innerHTML = '<div style="color:#64748b;">尚未開始抽籤，紀錄將於抽籤後自動寫入...</div>';
        return;
      }
      list.innerHTML = historyLog.map(item => item.type === 'swap' ? `<div class="history-item" style="color:#f472b6;">🔀 手動調整 ➔ ${getStudentDisplayName(item.studentId)} 換到座位【${item.seatLabel}】${item.otherStudentId ? `（與 ${getStudentDisplayName(item.otherStudentId)} 互換）` : '（原位置清空）'}</div>` : `
        <div class="history-item">
          步數 ${item.step} ➔ 👤 ${getStudentDisplayName(item.studentId)} 抽中座位【${item.seatLabel}】 (接棒：${item.nextStudentId ? getStudentDisplayName(item.nextStudentId) : '🎉 全班完成'})
        </div>
      `).join('');
      list.scrollTop = list.scrollHeight;
    }

    function getNextStudentId(targetSeatLabel) {
      const drawnSet = new Set(drawnStudents);
      const parsedNum = parseInt(targetSeatLabel);
      if (!isNaN(parsedNum) && parsedNum >= 1 && parsedNum <= TOTAL_SEATS && !drawnSet.has(parsedNum)) {
        return parsedNum;
      }
      for (let cand = 1; cand <= TOTAL_SEATS; cand++) {
        if (!drawnSet.has(cand)) return cand;
      }
      return null;
    }

    function startChainDraw() {
      if (isEditingMode) toggleEditMode();
      if (isSwapMode) toggleSwapMode();
      initAudio();
      
      if (!isGameStarted) {
        isGameStarted = true;
        document.getElementById('starterSelect').disabled = true;
      }

      const availableIndices = [];
      seats.forEach((seat, idx) => {
        if (seat.assignedStudentId === null) availableIndices.push(idx);
      });

      if (availableIndices.length === 0) return;

      document.getElementById('drawBtn').disabled = true;
      isSpinning = true;

      const targetSeatIdx = availableIndices[Math.floor(Math.random() * availableIndices.length)];
      const targetSeat = seats[targetSeatIdx];

      let speed = 40;
      let step = 0;
      let totalSteps = 25 + Math.floor(Math.random() * 10);

      function spin() {
        step++;
        const currentSeatIdx = availableIndices[step % availableIndices.length];
        playSound(400 + (step % 5) * 50);
        render(currentSeatIdx);

        if (step < totalSteps) {
          setTimeout(spin, speed);
        } else if (speed < 350) {
          speed += 45;
          setTimeout(spin, speed);
        } else {
          targetSeat.assignedStudentId = currentStudentId;
          drawnStudents.push(currentStudentId);
          
          const nextStudentId = getNextStudentId(targetSeat.label);

          historyLog.push({
            step: historyLog.filter(h => !h.type).length + 1,
            studentId: currentStudentId,
            seatLabel: targetSeat.label,
            nextStudentId: nextStudentId
          });

          [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => playSound(f, 0.2), i * 100));

          document.getElementById('nextBox').innerText = nextStudentId ? `👉 下一位接棒：${getStudentDisplayName(nextStudentId)}` : '🎉 全班完成！';

          render();
          renderHistory();

          if (nextStudentId) {
            currentStudentId = nextStudentId;
            document.getElementById('drawBtn').disabled = false;
          } else {
            document.getElementById('drawBtn').disabled = true;
          }
          isSpinning = false;
          saveData();
        }
      }

      spin();
    }

    // 將 HTML Canvas 繪製並下載為高畫質 PNG 圖片
    function exportToImage() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const width = 1200;
      const height = 900;
      canvas.width = width;
      canvas.height = height;

      // 深色背景
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, width, height);

      // 標題
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('201 班級座位表', width / 2, 60);

      // 黑板區
      ctx.fillStyle = '#14532d';
      ctx.strokeStyle = '#166534';
      ctx.lineWidth = 4;
      ctx.fillRect(width * 0.15, 90, width * 0.7, 45);
      ctx.strokeRect(width * 0.15, 90, width * 0.7, 45);
      ctx.fillStyle = '#f0fdf4';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText('【 黑 板 / 螢 幕 區 】', width / 2, 120);

      // 講桌
      ctx.fillStyle = '#78350f';
      ctx.strokeStyle = '#b45309';
      ctx.lineWidth = 3;
      ctx.fillRect(width * 0.36, 145, width * 0.28, 35);
      ctx.strokeRect(width * 0.36, 145, width * 0.28, 35);
      ctx.fillStyle = '#fef3c7';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillText('🏫 講 桌（教師位）', width / 2, 168);

      // 座位 6x6 陣列
      const cols = 6;
      const rows = 6;
      const startX = 80;
      const startY = 210;
      const cellW = 160;
      const cellH = 95;
      const gapX = 15;
      const gapY = 15;

      seats.forEach((seat, idx) => {
        const c = idx % cols;
        const r = Math.floor(idx / cols);
        const x = startX + c * (cellW + gapX);
        const y = startY + r * (cellH + gapY);

        ctx.lineWidth = 2;
        if (seat.assignedStudentId !== null) {
          ctx.fillStyle = '#15803d';
          ctx.strokeStyle = '#4ade80';
        } else {
          ctx.fillStyle = '#1e293b';
          ctx.strokeStyle = '#334155';
        }

        // 圓角矩形座位
        ctx.beginPath();
        ctx.roundRect(x, y, cellW, cellH, 8);
        ctx.fill();
        ctx.stroke();

        const nameY = y + cellH / 2 + 6;

        // 學生名稱/空位
        if (seat.assignedStudentId !== null) {
          ctx.fillStyle = '#f0fdf4';
          ctx.font = 'bold 18px sans-serif';
          ctx.fillText(`👤 ${getStudentDisplayName(seat.assignedStudentId)}`, x + cellW / 2, nameY);
        } else {
          ctx.fillStyle = '#64748b';
          ctx.font = '16px sans-serif';
          ctx.fillText('(空位)', x + cellW / 2, nameY);
        }
      });

      // 觸發下載
      const imageURL = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = imageURL;
      a.download = `201座位表_圖片檔_${new Date().toISOString().slice(0,10)}.png`;
      a.click();
    }

    function exportToCSV() {
      if (historyLog.length === 0) {
        alert('目前尚無抽籤紀錄可匯出！');
        return;
      }
      let csvContent = "\uFEFF步數,學生座號,學生姓名,抽中座位號碼,接棒學生\n";
      historyLog.forEach(item => {
        if (item.type === 'swap') {
          csvContent += `手動調整,${item.studentId},${studentNames[item.studentId - 1] || ''},${item.seatLabel},${item.otherStudentId ? '與' + item.otherStudentId + '號互換' : '移到空位'}\n`;
          return;
        }
        const studentName = studentNames[item.studentId - 1] || '';
        const nextName = item.nextStudentId ? getStudentDisplayName(item.nextStudentId) : '完成';
        csvContent += `${item.step},${item.studentId},${studentName},${item.seatLabel},${nextName}\n`;
      });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `201座位表_抽籤紀錄_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    function resetAllData() {
      if (confirm('確定要清空目前的抽籤紀錄與座位嗎？（學生名單將會保留）')) {
        seats = Array.from({length: TOTAL_SEATS}, (_, i) => ({ label: `${i + 1}`, assignedStudentId: null }));
        drawnStudents = [];
        historyLog = [];
        currentStudentId = 1;
        isGameStarted = false;
        
        saveData();
        initStarterSelect();
        document.getElementById('drawBtn').disabled = false;
        document.getElementById('nextBox').innerText = '下一位：? 號';
        document.getElementById('historyList').innerHTML = '<div style="color:#64748b;">紀錄已重置...</div>';
        render();
      }
    }

    loadData();
    refreshUI();
    initCloud();
  </script>
</body>
</html>
